[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freqtrade-equities"
version = "1.0.0"
description = "Independent Alpaca Paper swing trading dashboard and backtester"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "GPL-3.0"}
dependencies = ["tzdata>=2024.1"]

[project.optional-dependencies]
macos = ["pyinstaller>=6", "certifi", "Pillow"]
development = ["ruff", "build"]

[project.scripts]
bolsa-paper = "equities.__main__:main"

[tool.setuptools.packages.find]
include = ["equities", "equities.*"]
namespaces = false

[tool.setuptools.package-data]
equities = ["*.html", "*.js"]

[tool.ruff]
line-length = 100
